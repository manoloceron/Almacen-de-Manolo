<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizador Inteligente - True Course & Despacho</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .main-container {
            max-width: 1600px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 20px;
            height: calc(100vh - 40px);
        }
        
        /* BRAIN DUMP - IZQUIERDA */
        .brain-dump {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .brain-dump-header {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 25px;
        }
        
        .brain-dump-header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        
        .brain-dump-header p {
            opacity: 0.9;
            font-size: 14px;
        }
        
        .inbox-count {
            background: rgba(255,255,255,0.2);
            padding: 8px 15px;
            border-radius: 20px;
            margin-top: 10px;
            display: inline-block;
            font-size: 14px;
            font-weight: 600;
        }
        
        .add-task-form {
            padding: 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
        }
        
        .form-group {
            margin-bottom: 12px;
        }
        
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #6c757d;
            margin-bottom: 5px;
        }
        
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn-add-task {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .btn-add-task:hover {
            transform: translateY(-2px);
        }
        
        .inbox-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }
        
        .inbox-item {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            cursor: move;
            transition: all 0.2s;
        }
        
        .inbox-item:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }
        
        .inbox-item.dragging {
            opacity: 0.5;
        }
        
        .inbox-item-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 8px;
        }
        
        .inbox-item-name {
            font-weight: 600;
            color: #1f2937;
            font-size: 15px;
            flex: 1;
        }
        
        .inbox-item-meta {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }
        
        .badge-tc {
            background: #dbeafe;
            color: #1e40af;
        }
        
        .badge-despacho {
            background: #fce7f3;
            color: #be185d;
        }
        
        .badge-personal {
            background: #d1fae5;
            color: #065f46;
        }
        
        .badge-time {
            background: #f3f4f6;
            color: #4b5563;
        }
        
        .btn-auto-assign {
            width: 100%;
            padding: 8px;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-auto-assign:hover {
            background: #059669;
        }
        
        .btn-delete {
            background: #ef4444;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            margin-left: 8px;
        }
        
        /* HORARIO - DERECHA */
        .schedule-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .schedule-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
        }
        
        .schedule-header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        
        .date-navigation {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255,255,255,0.2);
            padding: 12px 20px;
            border-radius: 12px;
            margin-top: 15px;
            margin-bottom: 15px;
        }
        
        .date-nav-btn {
            background: rgba(255,255,255,0.3);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .date-nav-btn:hover {
            background: rgba(255,255,255,0.4);
        }
        
        .date-nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .current-date-display {
            font-size: 18px;
            font-weight: bold;
            color: white;
        }
        
        .date-indicator {
            font-size: 12px;
            opacity: 0.9;
            margin-top: 2px;
        }
        
        .btn-close-day {
            background: rgba(255,255,255,0.3);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
            margin-left: auto;
        }
        
        .btn-close-day:hover {
            background: rgba(255,255,255,0.4);
        }
        
        .schedule-stats {
            display: flex;
            gap: 20px;
            margin-top: 15px;
        }
        
        .schedule-stat {
            background: rgba(255,255,255,0.2);
            padding: 10px 20px;
            border-radius: 10px;
            text-align: center;
        }
        
        .schedule-stat-number {
            font-size: 20px;
            font-weight: bold;
        }
        
        .schedule-stat-label {
            font-size: 11px;
            opacity: 0.9;
            margin-top: 2px;
        }
        
        .schedule-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        
        .time-block {
            margin-bottom: 25px;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }
        
        .time-block.despacho {
            border-left-color: #f093fb;
        }
        
        .time-block.personal {
            border-left-color: #10b981;
        }
        
        .time-block-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .time-block-title {
            font-size: 18px;
            font-weight: bold;
            color: #1f2937;
        }
        
        .time-block-time {
            font-size: 14px;
            color: #667eea;
            font-weight: 600;
        }
        
        .time-block.despacho .time-block-time {
            color: #f093fb;
        }
        
        .time-block.personal .time-block-time {
            color: #10b981;
        }
        
        .time-block-capacity {
            font-size: 12px;
            color: #6b7280;
            margin-top: 4px;
        }
        
        .time-slots {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .scheduled-task {
            background: #f9fafb;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            padding: 12px 15px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        
        .scheduled-task:hover {
            background: #f3f4f6;
            border-color: #667eea;
        }
        
        .scheduled-task.completed {
            background: #d1fae5;
            border-color: #10b981;
            opacity: 0.7;
        }
        
        .scheduled-task-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 5px;
        }
        
        .scheduled-task-name {
            font-weight: 600;
            color: #1f2937;
            font-size: 14px;
            flex: 1;
        }
        
        .scheduled-task-time {
            font-size: 13px;
            color: #667eea;
            font-weight: 600;
            margin-left: 10px;
        }
        
        .scheduled-task-meta {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        
        .btn-complete {
            background: #10b981;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            margin-left: 8px;
        }
        
        .btn-edit {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
        }
        
        .btn-move-tomorrow {
            background: #f59e0b;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            margin-left: 5px;
        }
        
        .btn-move-tomorrow:hover {
            background: #d97706;
        }
        
        .scheduled-task-actions {
            display: flex;
            gap: 5px;
            margin-top: 8px;
        }
        
        .drop-zone {
            min-height: 50px;
            border: 2px dashed #d1d5db;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #9ca3af;
            font-size: 13px;
            padding: 15px;
            margin-top: 8px;
        }
        
        .drop-zone.drag-over {
            border-color: #667eea;
            background: #eef2ff;
            color: #667eea;
        }
        
        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .modal-header {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #1f2937;
        }
        
        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .btn-modal {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-save {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-cancel {
            background: #e5e7eb;
            color: #4b5563;
        }
        
        .btn-modal:hover {
            transform: translateY(-2px);
        }
        
        .alert {
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 13px;
        }
        
        .alert-warning {
            background: #fef3c7;
            color: #92400e;
            border-left: 4px solid #f59e0b;
        }
        
        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border-left: 4px solid #ef4444;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #9ca3af;
        }
        
        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- BRAIN DUMP - IZQUIERDA -->
        <div class="brain-dump">
            <div class="brain-dump-header">
                <h1>📥 Brain Dump</h1>
                <p>Captura tareas rápido aquí</p>
                <div class="inbox-count">
                    <span id="inboxCount">0</span> tareas sin asignar
                </div>
            </div>
            
            <div class="add-task-form">
                <div class="form-group">
                    <label>Nombre de la tarea</label>
                    <input type="text" id="taskName" placeholder="Ej: Revisar facturas...">
                </div>
                
                <div class="form-group">
                    <label>Tipo</label>
                    <select id="taskType">
                        <option value="tc">True Course</option>
                        <option value="despacho">Despacho</option>
                        <option value="personal">Personal</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Tiempo estimado</label>
                    <select id="taskDuration">
                        <option value="15">15 minutos</option>
                        <option value="30">30 minutos</option>
                        <option value="45">45 minutos</option>
                        <option value="60">1 hora</option>
                        <option value="90">1.5 horas</option>
                        <option value="120">2 horas</option>
                        <option value="180">3 horas</option>
                    </select>
                </div>
                
                <button class="btn-add-task" onclick="addTaskToInbox()">+ Agregar Tarea</button>
            </div>
            
            <div class="inbox-list" id="inboxList">
                <div class="empty-state">
                    <div class="empty-state-icon">💡</div>
                    <p>No hay tareas sin asignar</p>
                </div>
            </div>
        </div>
        
        <!-- HORARIO - DERECHA -->
        <div class="schedule-container">
            <div class="schedule-header">
                <h1>📅 Horario del Día</h1>
                <div class="date-navigation">
                    <button class="date-nav-btn" onclick="navigateDay(-1)">← Día Anterior</button>
                    <div style="text-align: center;">
                        <div class="current-date-display" id="currentDateDisplay">Hoy</div>
                        <div class="date-indicator" id="dateIndicator">Martes, 26 de Mayo 2026</div>
                    </div>
                    <button class="date-nav-btn" onclick="navigateDay(1)">Día Siguiente →</button>
                </div>
                <div style="display: flex; align-items: center; gap: 15px;">
                    <div class="schedule-stats" style="flex: 1;">
                        <div class="schedule-stat">
                            <div class="schedule-stat-number" id="totalTasks">10</div>
                            <div class="schedule-stat-label">Total</div>
                        </div>
                        <div class="schedule-stat">
                            <div class="schedule-stat-number" id="completedTasks">0</div>
                            <div class="schedule-stat-label">Completadas</div>
                        </div>
                        <div class="schedule-stat">
                            <div class="schedule-stat-number" id="pendingTasks">10</div>
                            <div class="schedule-stat-label">Pendientes</div>
                        </div>
                    </div>
                    <button class="btn-close-day" onclick="closeDayAndReschedule()">🔄 Cerrar Día</button>
                </div>
            </div>
            
            <div class="schedule-content" id="scheduleContent">
                <!-- Los bloques de tiempo se generarán dinámicamente -->
            </div>
        </div>
    </div>
    
    <!-- MODAL PARA EDITAR TAREAS -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">Editar Tarea</div>
            <div id="modalAlert"></div>
            <div class="form-group">
                <label>Nombre</label>
                <input type="text" id="editTaskName">
            </div>
            <div class="form-group">
                <label>Hora de inicio</label>
                <input type="time" id="editTaskTime">
            </div>
            <div class="form-group">
                <label>Duración (minutos)</label>
                <input type="number" id="editTaskDuration" min="15" step="15">
            </div>
            <div class="form-group">
                <label>Bloque</label>
                <select id="editTaskBlock">
                    <option value="tc-morning">True Course Mañana (8:00-2:00)</option>
                    <option value="tc-afternoon">True Course Tarde (3:00-4:00)</option>
                    <option value="despacho">Despacho (4:30-6:30)</option>
                </select>
            </div>
            <div class="modal-buttons">
                <button class="btn-modal btn-cancel" onclick="closeEditModal()">Cancelar</button>
                <button class="btn-modal btn-save" onclick="saveTaskEdit()">Guardar</button>
            </div>
        </div>
    </div>
    
    <script>
        // Estado global
        let state = {
            inbox: [],
            scheduledByDate: {}, // Formato: { '2026-05-26': [...tasks], '2026-05-27': [...tasks] }
            currentDate: getTodayDateString(), // Fecha actual en formato YYYY-MM-DD
            timeBlocks: [
                {
                    id: 'tc-morning',
                    name: 'True Course - Mañana',
                    type: 'tc',
                    start: '08:00',
                    end: '14:00',
                    capacity: 360 // minutos
                },
                {
                    id: 'tc-afternoon',
                    name: 'True Course - Cierre',
                    type: 'tc',
                    start: '15:00',
                    end: '16:00',
                    capacity: 60
                },
                {
                    id: 'despacho',
                    name: 'Despacho',
                    type: 'despacho',
                    start: '16:30',
                    end: '18:30',
                    capacity: 120
                }
            ]
        };
        
        let editingTaskId = null;
        
        // Obtener fecha de hoy en formato YYYY-MM-DD
        function getTodayDateString() {
            const today = new Date();
            return today.toISOString().split('T')[0];
        }
        
        // Obtener tareas del día actual
        function getCurrentDayTasks() {
            return state.scheduledByDate[state.currentDate] || [];
        }
        
        // Establecer tareas del día actual
        function setCurrentDayTasks(tasks) {
            state.scheduledByDate[state.currentDate] = tasks;
        }
        
        // Inicializar con tareas existentes
        function initializeSchedule() {
            const today = getTodayDateString();
            state.currentDate = today;
            state.scheduledByDate[today] = [
                { id: 'tc1', name: 'Limpiar bandeja de entrada', type: 'tc', duration: 60, startTime: '08:00', block: 'tc-morning', completed: false, date: today },
                { id: 'tc2', name: 'Productivity Report', type: 'tc', duration: 60, startTime: '09:00', block: 'tc-morning', completed: false, date: today },
                { id: 'tc3', name: 'King Bean Coffee - Correo', type: 'tc', duration: 30, startTime: '10:00', block: 'tc-morning', completed: false, date: today },
                { id: 'tc4', name: 'Ver conciliación', type: 'tc', duration: 30, startTime: '10:30', block: 'tc-morning', completed: false, date: today },
                { id: 'tc5', name: 'Junta con Directores', type: 'tc', duration: 180, startTime: '11:00', block: 'tc-morning', completed: false, date: today },
                { id: 'tc6', name: 'Correos y cierre', type: 'tc', duration: 60, startTime: '15:00', block: 'tc-afternoon', completed: false, date: today },
                { id: 'desp1', name: 'FIEL de IVÁN', type: 'despacho', duration: 15, startTime: '16:30', block: 'despacho', completed: false, date: today },
                { id: 'desp2', name: 'FIEL de JAVA', type: 'despacho', duration: 15, startTime: '16:45', block: 'despacho', completed: false, date: today },
                { id: 'desp3', name: 'Papeles hijo de Edgardo', type: 'despacho', duration: 35, startTime: '17:00', block: 'despacho', completed: false, date: today },
                { id: 'desp4', name: 'Facturas de Cobro - 10 Clientes', type: 'despacho', duration: 60, startTime: '17:35', block: 'despacho', completed: false, date: today }
            ];
            
            saveState();
            updateDateDisplay();
            render();
        }
        
        // Guardar estado en localStorage
        function saveState() {
            localStorage.setItem('taskManagerState', JSON.stringify(state));
        }
        
        // Cargar estado de localStorage
        function loadState() {
            const saved = localStorage.getItem('taskManagerState');
            if (saved) {
                const loaded = JSON.parse(saved);
                // Migrar datos antiguos si existen
                if (loaded.scheduled && !loaded.scheduledByDate) {
                    const today = getTodayDateString();
                    loaded.scheduledByDate = {};
                    loaded.scheduledByDate[today] = loaded.scheduled;
                    delete loaded.scheduled;
                }
                // Asegurar que currentDate existe
                if (!loaded.currentDate) {
                    loaded.currentDate = getTodayDateString();
                }
                state = loaded;
            } else {
                initializeSchedule();
                return;
            }
        }
        
        // Formatear fecha para display
        function formatDateDisplay(dateStr) {
            const date = new Date(dateStr + 'T12:00:00');
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const tomorrow = new Date(today);
            tomorrow.setDate(tomorrow.getDate() + 1);
            
            const targetDate = new Date(dateStr + 'T12:00:00');
            targetDate.setHours(0, 0, 0, 0);
            
            if (targetDate.getTime() === today.getTime()) {
                return 'Hoy';
            } else if (targetDate.getTime() === tomorrow.getTime()) {
                return 'Mañana';
            } else {
                const days = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
                const months = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
                return `${days[date.getDay()]}, ${date.getDate()} de ${months[date.getMonth()]}`;
            }
        }
        
        // Actualizar display de fecha
        function updateDateDisplay() {
            const date = new Date(state.currentDate + 'T12:00:00');
            const days = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
            const months = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
            
            document.getElementById('currentDateDisplay').textContent = formatDateDisplay(state.currentDate);
            document.getElementById('dateIndicator').textContent = `${days[date.getDay()]}, ${date.getDate()} de ${months[date.getMonth()]} ${date.getFullYear()}`;
        }
        
        // Navegar días
        function navigateDay(offset) {
            const currentDate = new Date(state.currentDate + 'T12:00:00');
            currentDate.setDate(currentDate.getDate() + offset);
            state.currentDate = currentDate.toISOString().split('T')[0];
            
            // Inicializar día si no existe
            if (!state.scheduledByDate[state.currentDate]) {
                state.scheduledByDate[state.currentDate] = [];
            }
            
            updateDateDisplay();
            render();
        }
        
        // Cerrar día y reprogramar incompletas
        function closeDayAndReschedule() {
            const tasks = getCurrentDayTasks();
            const incomplete = tasks.filter(t => !t.completed);
            
            if (incomplete.length === 0) {
                alert('¡Excelente! Todas las tareas del día están completadas.');
                return;
            }
            
            if (!confirm(`Hay ${incomplete.length} tareas pendientes. ¿Moverlas todas a mañana?`)) {
                return;
            }
            
            const tomorrow = getNextDate(state.currentDate);
            
            // Remover incompletas del día actual
            setCurrentDayTasks(tasks.filter(t => t.completed));
            
            // Agregar a mañana con auto-asignación
            incomplete.forEach(task => {
                moveTaskToDate(task, tomorrow);
            });
            
            saveState();
            render();
            alert(`${incomplete.length} tareas movidas a ${formatDateDisplay(tomorrow)}`);
        }
        
        // Mover tarea a otra fecha
        function moveTaskToDate(task, targetDate) {
            if (!state.scheduledByDate[targetDate]) {
                state.scheduledByDate[targetDate] = [];
            }
            
            // Actualizar fecha de la tarea
            task.date = targetDate;
            
            // Auto-asignar en el nuevo día
            const result = autoAssignTaskToDate(task, targetDate);
            
            if (!result) {
                // Si no se puede auto-asignar, agregar sin horario asignado
                task.startTime = null;
                task.block = null;
                state.scheduledByDate[targetDate].push(task);
            }
        }
        
        // Mover tarea manualmente a mañana
        function moveToTomorrow(taskId) {
            const tasks = getCurrentDayTasks();
            const taskIndex = tasks.findIndex(t => t.id === taskId);
            
            if (taskIndex === -1) return;
            
            const task = tasks[taskIndex];
            const tomorrow = getNextDate(state.currentDate);
            
            // Remover del día actual
            tasks.splice(taskIndex, 1);
            setCurrentDayTasks(tasks);
            
            // Mover a mañana
            moveTaskToDate(task, tomorrow);
            
            saveState();
            render();
            alert(`Tarea movida a ${formatDateDisplay(tomorrow)}`);
        }
        
        // Obtener siguiente fecha
        function getNextDate(dateStr) {
            const date = new Date(dateStr + 'T12:00:00');
            date.setDate(date.getDate() + 1);
            return date.toISOString().split('T')[0];
        }
        
        // Agregar tarea al inbox
        function addTaskToInbox() {
            const name = document.getElementById('taskName').value.trim();
            const type = document.getElementById('taskType').value;
            const duration = parseInt(document.getElementById('taskDuration').value);
            
            if (!name) {
                alert('Por favor ingresa un nombre para la tarea');
                return;
            }
            
            const task = {
                id: 'task_' + Date.now(),
                name,
                type,
                duration,
                completed: false
            };
            
            state.inbox.push(task);
            
            // Limpiar formulario
            document.getElementById('taskName').value = '';
            
            saveState();
            renderInbox();
            updateStats();
        }
        
        // Auto-asignar tarea al día actual o futuro
        function autoAssignTask(taskId) {
            const task = state.inbox.find(t => t.id === taskId);
            if (!task) return;
            
            // Intentar asignar en los próximos 7 días
            for (let dayOffset = 0; dayOffset < 7; dayOffset++) {
                const targetDate = getDateWithOffset(state.currentDate, dayOffset);
                
                if (autoAssignTaskToDate(task, targetDate)) {
                    // Remover de inbox
                    state.inbox = state.inbox.filter(t => t.id !== taskId);
                    
                    saveState();
                    render();
                    
                    if (dayOffset === 0) {
                        alert('Tarea asignada para hoy');
                    } else if (dayOffset === 1) {
                        alert('No cabía hoy. Tarea asignada para mañana');
                    } else {
                        alert(`No cabía antes. Tarea asignada para ${formatDateDisplay(targetDate)}`);
                    }
                    return;
                }
            }
            
            alert(`No hay espacio disponible en los próximos 7 días para una tarea de ${task.duration} minutos en bloques de ${task.type.toUpperCase()}`);
        }
        
        // Auto-asignar tarea a una fecha específica
        function autoAssignTaskToDate(task, targetDate) {
            if (!state.scheduledByDate[targetDate]) {
                state.scheduledByDate[targetDate] = [];
            }
            
            const targetBlocks = state.timeBlocks.filter(b => b.type === task.type);
            
            for (let block of targetBlocks) {
                const usedTime = calculateUsedTimeForDate(block.id, targetDate);
                const availableTime = block.capacity - usedTime;
                
                if (availableTime >= task.duration) {
                    const startTime = findNextAvailableSlotForDate(block.id, task.duration, targetDate);
                    
                    if (startTime) {
                        state.scheduledByDate[targetDate].push({
                            ...task,
                            startTime,
                            block: block.id,
                            date: targetDate
                        });
                        return true;
                    }
                }
            }
            
            return false;
        }
        
        // Obtener fecha con offset
        function getDateWithOffset(dateStr, offset) {
            const date = new Date(dateStr + 'T12:00:00');
            date.setDate(date.getDate() + offset);
            return date.toISOString().split('T')[0];
        }
        
        // Calcular tiempo usado en un bloque para una fecha
        function calculateUsedTimeForDate(blockId, date) {
            const tasks = state.scheduledByDate[date] || [];
            return tasks
                .filter(t => t.block === blockId)
                .reduce((sum, t) => sum + t.duration, 0);
        }
        
        // Encontrar siguiente slot disponible para una fecha
        function findNextAvailableSlotForDate(blockId, duration, date) {
            const block = state.timeBlocks.find(b => b.id === blockId);
            const tasksInBlock = (state.scheduledByDate[date] || [])
                .filter(t => t.block === blockId)
                .sort((a, b) => a.startTime.localeCompare(b.startTime));
            
            let currentTime = block.start;
            
            for (let task of tasksInBlock) {
                if (timeToMinutes(task.startTime) - timeToMinutes(currentTime) >= duration) {
                    return currentTime;
                }
                currentTime = addMinutesToTime(task.startTime, task.duration);
            }
            
            if (timeToMinutes(block.end) - timeToMinutes(currentTime) >= duration) {
                return currentTime;
            }
            
            return null;
        }
        
        // Calcular tiempo usado en un bloque (día actual)
        function calculateUsedTime(blockId) {
            return calculateUsedTimeForDate(blockId, state.currentDate);
        }
        
        // Encontrar siguiente slot disponible (día actual)
        function findNextAvailableSlot(blockId, duration) {
            return findNextAvailableSlotForDate(blockId, duration, state.currentDate);
        }
        
        // Convertir tiempo a minutos
        function timeToMinutes(time) {
            const [hours, minutes] = time.split(':').map(Number);
            return hours * 60 + minutes;
        }
        
        // Agregar minutos a un tiempo
        function addMinutesToTime(time, minutes) {
            const totalMinutes = timeToMinutes(time) + minutes;
            const hours = Math.floor(totalMinutes / 60);
            const mins = totalMinutes % 60;
            return `${String(hours).padStart(2, '0')}:${String(mins).padStart(2, '0')}`;
        }
        
        // Eliminar tarea del inbox
        function deleteFromInbox(taskId) {
            if (confirm('¿Eliminar esta tarea?')) {
                state.inbox = state.inbox.filter(t => t.id !== taskId);
                saveState();
                renderInbox();
                updateStats();
            }
        }
        
        // Marcar tarea como completada
        function toggleComplete(taskId) {
            const tasks = getCurrentDayTasks();
            const task = tasks.find(t => t.id === taskId);
            if (task) {
                task.completed = !task.completed;
                saveState();
                renderSchedule();
                updateStats();
            }
        }
        
        // Abrir modal de edición
        function openEditModal(taskId) {
            editingTaskId = taskId;
            const tasks = getCurrentDayTasks();
            const task = tasks.find(t => t.id === taskId);
            
            if (!task) return;
            
            document.getElementById('editTaskName').value = task.name;
            document.getElementById('editTaskTime').value = task.startTime;
            document.getElementById('editTaskDuration').value = task.duration;
            document.getElementById('editTaskBlock').value = task.block;
            document.getElementById('modalAlert').innerHTML = '';
            
            document.getElementById('editModal').classList.add('active');
        }
        
        // Cerrar modal
        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
            editingTaskId = null;
        }
        
        // Guardar edición de tarea
        function saveTaskEdit() {
            const tasks = getCurrentDayTasks();
            const task = tasks.find(t => t.id === editingTaskId);
            if (!task) return;
            
            const newName = document.getElementById('editTaskName').value.trim();
            const newTime = document.getElementById('editTaskTime').value;
            const newDuration = parseInt(document.getElementById('editTaskDuration').value);
            const newBlock = document.getElementById('editTaskBlock').value;
            
            if (!newName) {
                document.getElementById('modalAlert').innerHTML = '<div class="alert alert-error">El nombre no puede estar vacío</div>';
                return;
            }
            
            const block = state.timeBlocks.find(b => b.id === newBlock);
            if (timeToMinutes(newTime) < timeToMinutes(block.start) || 
                timeToMinutes(newTime) >= timeToMinutes(block.end)) {
                document.getElementById('modalAlert').innerHTML = 
                    `<div class="alert alert-error">La hora debe estar entre ${block.start} y ${block.end}</div>`;
                return;
            }
            
            const usedTime = calculateUsedTime(newBlock) - (task.block === newBlock ? task.duration : 0);
            const availableTime = block.capacity - usedTime;
            
            if (newDuration > availableTime) {
                document.getElementById('modalAlert').innerHTML = 
                    `<div class="alert alert-warning">Solo hay ${availableTime} minutos disponibles en este bloque</div>`;
                return;
            }
            
            task.name = newName;
            task.startTime = newTime;
            task.duration = newDuration;
            task.block = newBlock;
            
            saveState();
            render();
            closeEditModal();
        }
        
        // Eliminar tarea del horario
        function deleteScheduledTask(taskId) {
            if (confirm('¿Eliminar esta tarea del horario?')) {
                const tasks = getCurrentDayTasks();
                setCurrentDayTasks(tasks.filter(t => t.id !== taskId));
                saveState();
                render();
            }
        }
        
        // Renderizar inbox
        function renderInbox() {
            const inboxList = document.getElementById('inboxList');
            const inboxCount = document.getElementById('inboxCount');
            
            inboxCount.textContent = state.inbox.length;
            
            if (state.inbox.length === 0) {
                inboxList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">💡</div>
                        <p>No hay tareas sin asignar</p>
                    </div>
                `;
                return;
            }
            
            inboxList.innerHTML = state.inbox.map(task => `
                <div class="inbox-item" draggable="true">
                    <div class="inbox-item-header">
                        <div class="inbox-item-name">${task.name}</div>
                        <button class="btn-delete" onclick="deleteFromInbox('${task.id}')">✕</button>
                    </div>
                    <div class="inbox-item-meta">
                        <span class="badge badge-${task.type}">${task.type === 'tc' ? 'TC' : task.type === 'despacho' ? 'Despacho' : 'Personal'}</span>
                        <span class="badge badge-time">${task.duration} min</span>
                    </div>
                    <button class="btn-auto-assign" onclick="autoAssignTask('${task.id}')">⚡ Auto-asignar</button>
                </div>
            `).join('');
        }
        
        // Renderizar horario
        function renderSchedule() {
            const scheduleContent = document.getElementById('scheduleContent');
            const tasks = getCurrentDayTasks();
            
            scheduleContent.innerHTML = state.timeBlocks.map(block => {
                const tasksInBlock = tasks
                    .filter(t => t.block === block.id)
                    .sort((a, b) => a.startTime.localeCompare(b.startTime));
                
                const usedTime = calculateUsedTime(block.id);
                const availableTime = block.capacity - usedTime;
                
                return `
                    <div class="time-block ${block.type}">
                        <div class="time-block-header">
                            <div>
                                <div class="time-block-title">${block.name}</div>
                                <div class="time-block-capacity">
                                    Usado: ${usedTime}min / ${block.capacity}min 
                                    <span style="color: ${availableTime < 30 ? '#ef4444' : '#10b981'}">
                                        (Disponible: ${availableTime}min)
                                    </span>
                                </div>
                            </div>
                            <div class="time-block-time">${block.start} - ${block.end}</div>
                        </div>
                        <div class="time-slots">
                            ${tasksInBlock.map(task => {
                                const endTime = addMinutesToTime(task.startTime, task.duration);
                                return `
                                    <div class="scheduled-task ${task.completed ? 'completed' : ''}">
                                        <div class="scheduled-task-header">
                                            <div class="scheduled-task-name">${task.name}</div>
                                            <div class="scheduled-task-time">${task.startTime} - ${endTime}</div>
                                        </div>
                                        <div class="scheduled-task-meta">
                                            <span class="badge badge-time">${task.duration} min</span>
                                        </div>
                                        <div class="scheduled-task-actions">
                                            ${!task.completed ? 
                                                `<button class="btn-complete" onclick="event.stopPropagation(); toggleComplete('${task.id}')">✓ Completar</button>` :
                                                '<span style="color: #10b981; font-size: 12px; font-weight: 600;">✓ Completada</span>'
                                            }
                                            <button class="btn-edit" onclick="openEditModal('${task.id}')">✏️ Editar</button>
                                            ${!task.completed ? 
                                                `<button class="btn-move-tomorrow" onclick="moveToTomorrow('${task.id}')">→ Mañana</button>` :
                                                ''
                                            }
                                            <button class="btn-delete" onclick="deleteScheduledTask('${task.id}')" style="margin-left: auto;">🗑️ Eliminar</button>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                            ${tasksInBlock.length === 0 ? 
                                '<div class="drop-zone">Usa auto-asignar para agregar tareas aquí</div>' : 
                                ''
                            }
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        // Actualizar estadísticas
        function updateStats() {
            const tasks = getCurrentDayTasks();
            const total = tasks.length;
            const completed = tasks.filter(t => t.completed).length;
            const pending = total - completed;
            
            document.getElementById('totalTasks').textContent = total;
            document.getElementById('completedTasks').textContent = completed;
            document.getElementById('pendingTasks').textContent = pending;
        }
        
        // Renderizar todo
        function render() {
            renderInbox();
            renderSchedule();
            updateStats();
        }
        
        // Inicializar
        document.addEventListener('DOMContentLoaded', () => {
            loadState();
            updateDateDisplay();
            render();
        });
        
        // Enter para agregar tarea
        document.getElementById('taskName').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addTaskToInbox();
            }
        });
    </script>
</body>
</html>
